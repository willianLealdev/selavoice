# SelaVoice — ambiente completo (dev/staging). Uso:  docker compose up --build
# STATUS: escrito mas NÃO executado nesta máquina (Docker não instalado) — ver docs/BLOCKERS.md
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: selavoice
      POSTGRES_USER: selavoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selavoice"]
      interval: 5s
      retries: 10
    # Não expõe a porta ao host: só a rede interna enxerga o banco.

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-selavoice}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?defina MINIO_PASSWORD}
    volumes: [miniodata:/data]

  api:
    build: ./services/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://selavoice:${POSTGRES_PASSWORD}@postgres:5432/selavoice
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports: ["8000:8000"]

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
