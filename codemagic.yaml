# CODEMAGIC — fabrica os arquivos das lojas SEM você precisar de Mac nem Android Studio.
# Codemagic (codemagic.io) é um serviço que compila o app na nuvem. Ele guarda as chaves de assinatura (nunca ficam no GitHub).
# Os dois fluxos abaixo geram:  Android -> arquivo .aab (Google Play)   |   iOS -> arquivo .ipa (App Store / TestFlight)
#
# ATENÇÃO (honestidade): este arquivo foi escrito seguindo a documentação do Codemagic, mas AINDA NÃO FOI EXECUTADO.
# Na primeira vez pode aparecer algum erro de configuração; copie o log aqui na conversa que eu corrijo.
#
# O QUE VOCÊ CONFIGURA NO SITE DO CODEMAGIC (passo a passo no docs/PUBLICAR_LOJAS.md):
#   - Android: Team settings > Code signing identities > Android keystores > "Generate keystore" com o nome: selavoice_upload_key
#   - iOS: Team settings > Developer Portal > Integrations > App Store Connect, nome da integração: selavoice_asc
workflows:
  android-release:
    name: SelaVoice Android (.aab)
    instance_type: linux_x2
    max_build_duration: 45
    working_directory: apps/mobile
    environment:
      android_signing:
        - selavoice_upload_key
      vars:
        APP_ID: com.selavoice.app        # TEM de ser igual ao "nome do pacote" cadastrado no Google Play
        APP_VERSION: "1.0.0"             # número que o usuário vê; o número interno sobe sozinho a cada build
      node: 22
      java: 17
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Preparar o projeto Android
        script: |
          export BUILD_NUMBER=$PROJECT_BUILD_NUMBER
          npm run prepare:android
      - name: Gerar o arquivo .aab assinado
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - apps/mobile/android/app/build/outputs/bundle/release/*.aab

  ios-release:
    name: SelaVoice iOS (.ipa)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile
    integrations:
      app_store_connect: selavoice_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.selavoice.app   # TEM de ser igual ao Bundle ID cadastrado na Apple
      vars:
        APP_ID: com.selavoice.app
        APP_VERSION: "1.0.0"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Preparar o projeto iOS
        script: |
          export BUILD_NUMBER=$PROJECT_BUILD_NUMBER
          npm run prepare:ios
      - name: Aplicar a assinatura
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Gerar o arquivo .ipa
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - apps/mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true   # envia para o TestFlight (testes); a publicação na App Store você libera no App Store Connect
